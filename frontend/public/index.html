<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AirControl – Touchless Universe & Presenter</title>

  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/openlayers@4.6.5/dist/ol.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/openlayers@4.6.5/dist/ol.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #01030a;
      font-family: 'Sora', system-ui, sans-serif;
      color: #fff;
    }
    
    #universe-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #presenter-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      background: #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    
    #top-nav {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      gap: 12px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .nav-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 8px 18px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 20px;
      transition: all 0.3s;
    }
    .nav-btn.active, .nav-btn:hover {
      color: #fff;
      background: rgba(56, 189, 248, 0.25);
    }

    #presenter-controls {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 30;
      display: flex;
      gap: 10px;
      background: rgba(15, 23, 42, 0.9);
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    #slide-file-input {
      color: #cbd5e1;
      font-size: 13px;
    }
    .control-btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .control-btn:hover {
      background: #0369a1;
    }

    .hidden { display: none !important; }

    #btn-back-galaxy {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 20;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }

    #body-card {
      position: absolute;
      bottom: 30px;
      right: 30px;
      width: 320px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 20px;
      border-radius: 16px;
      z-index: 20;
    }

    #uni-scope {
      position: absolute;
      top: 25px;
      left: 25px;
      font-weight: 600;
      font-size: 18px;
      color: #38bdf8;
      z-index: 15;
    }
  </style>
</head>
<body>

  <div id="top-nav">
    <button class="nav-btn active" id="mode-universe">Universe</button>
    <button class="nav-btn" id="mode-presenter">Presenter</button>
  </div>

  <span id="uni-scope">Milky Way</span>
  <button id="btn-back-galaxy" class="hidden">← Back to Galaxy</button>

  <div id="presenter-controls" class="hidden">
    <input type="file" id="slide-file-input" multiple accept="image/*" />
    <button id="ppt-prev" class="control-btn">Prev</button>
    <button id="ppt-next" class="control-btn">Next</button>
  </div>

  <div id="universe-container">
    <canvas id="universe-canvas"></canvas>
  </div>

  <div id="presenter-container" class="hidden">
    <canvas id="presenter-canvas"></canvas>
  </div>

  <div id="earth-view" class="hidden" style="position: absolute; width: 100%; height: 100%; z-index: 10;">
    <div id="earth-map" style="width: 100%; height: 100%;"></div>
    <button id="earth-return" style="position: absolute; top: 20px; left: 20px; z-index: 25;" class="control-btn">Back to Space</button>
  </div>

  <div id="body-card" class="hidden">
    <span id="card-close" style="float: right; cursor: pointer;">✕</span>
    <h2 id="card-title" style="color: #38bdf8;"></h2>
    <p id="card-type" style="font-size: 12px; color: #94a3b8; margin-bottom: 10px;"></p>
    <p id="card-desc" style="font-size: 14px; margin-bottom: 15px;"></p>
    <dl id="card-facts" style="font-size: 13px;"></dl>
    <button id="card-action" class="control-btn hidden" style="width: 100%; margin-top: 15px;"></button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const btnUniverse = document.getElementById('mode-universe');
      const btnPresenter = document.getElementById('mode-presenter');
      const universeBox = document.getElementById('universe-container');
      const presenterBox = document.getElementById('presenter-container');
      const presenterControls = document.getElementById('presenter-controls');

      btnUniverse.onclick = () => {
        btnUniverse.classList.add('active');
        btnPresenter.classList.remove('active');
        universeBox.classList.remove('hidden');
        presenterBox.classList.add('hidden');
        presenterControls.classList.add('hidden');
      };

      btnPresenter.onclick = () => {
        btnPresenter.classList.add('active');
        btnUniverse.classList.remove('active');
        universeBox.classList.add('hidden');
        presenterBox.classList.remove('hidden');
        presenterControls.classList.remove('hidden');
      };
    });
  </script>

  <script src="universeMode.js"></script>
  <script src="presenterMode.js"></script>

</body>
</html>
