<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AirControl – 3D Universe & Touchless Map</title>
  
  <!-- Sora Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
  
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- OpenLayers CSS & JS (Direct Canvas Satellite Map for Touchless Gestures) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/openlayers/openlayers.github.io@master/en/v6.15.1/css/ol.css" type="text/css">
  <script src="https://cdn.jsdelivr.net/gh/openlayers/openlayers.github.io@master/en/v6.15.1/build/ol.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #01030a; font-family: 'Sora', sans-serif; color: #fff; }
    
    #universe-canvas { width: 100%; height: 100%; display: block; }
    
    /* Earth Surface View Overlay */
    #earth-view { position: absolute; inset: 0; background: #000; z-index: 50; display: flex; flex-direction: column; }
    #earth-view.hidden { display: none; }
    #earth-map { width: 100%; height: 100%; }
    
    /* Top Bar & Info UI */
    .header-bar { position: absolute; top: 20px; left: 20px; right: 20px; z-index: 10; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
    .header-bar * { pointer-events: auto; }
    .badge { background: rgba(13, 25, 48, 0.75); border: 1px solid rgba(94, 231, 255, 0.3); padding: 8px 16px; border-radius: 20px; backdrop-filter: blur(8px); font-size: 14px; color: #5ee7ff; }
    
    .btn { background: rgba(61, 123, 255, 0.25); border: 1px solid rgba(94, 231, 255, 0.5); color: #fff; padding: 8px 18px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-family: inherit; }
    .btn:hover { background: rgba(61, 123, 255, 0.5); }
    
    /* Body Info Card */
    #body-card { position: absolute; bottom: 30px; left: 30px; width: 320px; background: rgba(8, 15, 30, 0.85); border: 1px solid rgba(94, 231, 255, 0.25); border-radius: 16px; padding: 20px; backdrop-filter: blur(12px); z-index: 20; }
    #body-card.hidden { display: none; }
    #body-card h2 { font-size: 22px; color: #fff; margin-bottom: 4px; }
    #body-card .type { font-size: 12px; color: #5ee7ff; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
    #body-card .desc { font-size: 13px; color: #a4b8d9; line-height: 1.5; margin-bottom: 16px; }
    #body-card dl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; font-size: 12px; }
    #body-card dt { color: #6c8cb8; }
    #body-card dd { color: #fff; font-weight: 600; text-align: right; }
    #body-card .card-btn { width: 100%; padding: 10px; background: #3d7bff; border: none; border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer; }
    #body-card .card-close { position: absolute; top: 12px; right: 16px; background: none; border: none; color: #6c8cb8; font-size: 18px; cursor: pointer; }
    
    #earth-return { position: absolute; top: 20px; right: 20px; z-index: 60; }
  </style>
</head>
<body>

  <!-- Top Header UI -->
  <div class="header-bar">
    <div class="badge" id="uni-scope">Milky Way</div>
    <button class="btn hidden" id="btn-back-galaxy">Back to Galaxy</button>
  </div>

  <!-- Main 3D Universe Canvas -->
  <canvas id="universe-canvas"></canvas>

  <!-- Body Info Card Overlay -->
  <div id="body-card" class="hidden">
    <button class="card-close" id="card-close">&times;</button>
    <h2 id="card-title">Planet</h2>
    <div class="type" id="card-type">Celestial Body</div>
    <div class="desc" id="card-desc">Description goes here...</div>
    <dl id="card-facts"></dl>
    <button class="card-btn hidden" id="card-action">Explore</button>
  </div>

  <!-- Earth Surface View Overlay (OpenLayers Canvas Map) -->
  <div id="earth-view" class="hidden">
    <button class="btn" id="earth-return">Return to Space</button>
    <div id="earth-map"></div>
  </div>

  <!-- Universe Engine Script -->
  <script src="universeMode.js"></script>

</body>
</html>
